<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Tools · 21Grams</title>
<style>
  :root {
    --bg: #1A1A1A;
    --text: #EAEAEA;
    --gold: #DBBE8A;
    --black: #141414;
    --subcopy: #A0A0A0;
    --stroke: #595959;
    --serif: "Times New Roman", Times, serif;
    --sans: Arial, Helvetica, sans-serif;
    --h1: clamp(26px, 3.5vw, 43px);
    --logo-ref: clamp(40px, 5.5vw, 68px); /* logo size kept independent of heading */
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; font: 16px/1.5 var(--sans); color: var(--text); background: var(--bg); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 40px; }

  /* Header: heading left, logo right, sharing one baseline */
  header { padding: 72px 0 40px; }
  .masthead { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 24px 40px; }
  h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: var(--h1); line-height: 1; color: #fff; letter-spacing: -0.01em; }
  h1 em { font-style: italic; font-weight: 700; color: var(--gold); }
  /* Logo is cropped so its bottom edge is the letters' baseline.
     Full size = Times cap height (0.662em) × logo box / logo cap height (205.2 / 114.1); shown at 50%. */
  .logo { display: block; height: calc(var(--logo-ref) * 1.1906 * 0.5); width: auto; overflow: visible; fill: #fff; flex: none; }
  .intro { margin: 24px 0 0; color: var(--subcopy); max-width: 560px; }

  /* Search + tag filters */
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px 0 8px; padding-top: 16px; }
  input[type=search] { flex: 1 1 280px; padding: 12px 16px; border: 1px solid var(--stroke); border-radius: 10px; background: transparent; color: var(--text); font: inherit; }
  input[type=search]::placeholder { color: var(--subcopy); }
  input[type=search]:focus { outline: none; border-color: var(--gold); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 16px; }
  .tag-btn { padding: 6px 14px; border: 1px solid var(--stroke); border-radius: 999px; background: transparent; color: var(--text); font: inherit; font-size: 14px; cursor: pointer; }
  .tag-btn:hover { border-color: var(--gold); }
  .tag-btn[aria-pressed=true] { background: var(--gold); border-color: var(--gold); color: var(--black); }

  /* Tool cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 32px 0 80px; }
  .card { display: flex; flex-direction: column; gap: 10px; padding: 26px 26px 22px; border: 0.5px solid var(--gold); border-radius: 16px; text-decoration: none; color: inherit; transition: background .2s, transform .2s; }
  .card:hover, .card:focus-visible { background: rgba(219, 190, 138, 0.07); transform: translateY(-2px); outline: none; }
  .card h2 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 20px; line-height: 1.2; color: #fff; }
  .card h2::after { content: " →"; color: var(--gold); opacity: 0; transition: opacity .2s; }
  .card:hover h2::after { opacity: 1; }
  .card p { margin: 0; color: var(--subcopy); font-size: 15px; flex: 1; }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 14px; margin-top: 4px; border-top: 1px solid var(--stroke); font-size: 13px; color: var(--subcopy); }
  .meta .tags-inline span { display: inline-block; margin-left: 6px; padding: 2px 10px; border: 1px solid var(--stroke); border-radius: 999px; font-size: 12px; color: var(--text); }
  .empty { color: var(--subcopy); }

  footer { padding: 24px 0 48px; border-top: 1px solid var(--stroke); color: var(--subcopy); font-size: 13px; }

  @media (max-width: 600px) {
    .wrap { padding: 0 20px; }
    header { padding-top: 48px; }
  }
</style>
</head>
<body>

    </div>
    <p class="intro">Shared HTML tools built by the team. Click a card to open a tool.</p>
  </header>

  <main>
    <div class="controls">
      <input type="search" id="q" placeholder="Search tools…" aria-label="Search tools">
    </div>
    <div class="tags" id="tags"></div>
    <div class="grid" id="grid"></div>
  </main>

  <footer>21Grams Design</footer>
</div>

<script>
  let tools = [], activeTag = null;
  const grid = document.getElementById('grid');
  const q = document.getElementById('q');
  const tagsEl = document.getElementById('tags');

  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function render() {
    const term = q.value.trim().toLowerCase();
    const list = tools.filter(t =>
      (!activeTag || (t.tags || []).includes(activeTag)) &&
      (!term || [t.name, t.description, t.author, ...(t.tags || [])].join(' ').toLowerCase().includes(term))
    );
    grid.innerHTML = list.length ? list.map(t => `
      <a class="card" href="${encodeURIComponent(t.folder)}/">
        <h2>${esc(t.name)}</h2>
        <p>${esc(t.description)}</p>
        <div class="meta"><span>${esc(t.author)}</span>
          <span class="tags-inline">${(t.tags || []).map(x => `<span>${esc(x)}</span>`).join('')}</span></div>
      </a>`).join('') : '<p class="empty">No tools match.</p>';
  }

  function renderTags() {
    const all = [...new Set(tools.flatMap(t => t.tags || []))].sort();
    tagsEl.innerHTML = ['All', ...all].map(tag =>
      `<button class="tag-btn" aria-pressed="${(tag === 'All' && !activeTag) || tag === activeTag}" data-tag="${esc(tag)}">${esc(tag)}</button>`).join('');
  }

  tagsEl.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    activeTag = b.dataset.tag === 'All' ? null : b.dataset.tag;
    renderTags(); render();
  });
  q.addEventListener('input', render);

  fetch('tools.json').then(r => r.json()).then(data => {
    tools = data.sort((a, b) => a.name.localeCompare(b.name));
    renderTags(); render();
  }).catch(() => { grid.innerHTML = '<p class="empty">Couldn’t load tools.json — check it’s valid JSON.</p>'; });
</script>
</body>
</html>
